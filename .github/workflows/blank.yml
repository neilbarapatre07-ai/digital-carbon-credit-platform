name: PBL Repository Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PBL repository
        uses: actions/checkout@v4

      - name: Validate PBL documents
        run: |
          test -f PBL_409_Synopsis.pdf
          test -f "pbl.pages"
          echo "PBL documents validated successfully"
